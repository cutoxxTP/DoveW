<style>
:root{--ground:#eef1f6;--chrome:#fff;--ink:#131a25;--muted:#5d6b7c;--line:#dbe2ec;

*{box-sizing:border-box}
body{margin:0;height:100dvh;display:flex;flex-direction:column;background:var(--ground);color:var(--ink);

header{display:flex;align-items:center;gap:14px;padding:9px 14px;background:var(--chrome);

.name{display:flex;flex-direction:column;line-height:1.2;margin-right:auto}
.name b{font-family:Archivo,sans-serif;font-size:14px}

.tabs{display:flex;gap:4px;flex-wrap:wrap}
button{font:600 13px/1 "Source Sans 3",sans-serif;color:var(--ink);background:none;

.seg{display:flex}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:7px 0 0 7px;margin-left:0}
.seg button:last-child{border-radius:0 7px 7px 0}
.frame{flex:1;overflow:auto;display:flex;justify-content:center;background:var(--ground)}
iframe{border:0;width:100%;height:100%;background:#fff}
iframe.mob{width:390px;max-width:100%;box-shadow:0 0 0 1px var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--ink);
  color:var(--ground);padding:9px 15px;border-radius:8px;font-size:12.5px;opacity:0;
  pointer-events:none;transition:opacity .18s;max-width:80vw;text-align:center}
.toast.on{opacity:.96}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

6px;flex-wrap:wrap;margin-bottom:20px}\n.creds-head p{font-size:.97rem;color:var(--muted)}\n.logos{display:flex;flex-wrap:wrap;align-items:center;gap:34px;justify-content:center}\n.logos img{height:30px;width:auto;opacity:.62;filter:grayscale(1);transition:opacity .15s,filter .15s}\n.logos img:hover{opacity:1;filter:none}\n.logos img.tall{height:44px}\n\n/* ---------- sezioni ---------- */\nsection{padding:74px 0}\nsection.alt{background:var(--paper-alt);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}\n.sec-head{max-width:62ch;margin-bottom:40px;display:flex;flex-direction:column;gap:14px}\n.two{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:start}\n.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:22px}\n.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px 24px;\n  display:flex;flex-direction:column;gap:11px}\n.card h3{color:var(--navy-700)}\n.card p{font-size:1rem}\n.card a{font-family:Archivo,sans-serif;font-weight:600;font-size:.93rem;text-decoration:none;margin-top:auto}\n.card a:hover{text-decoration:underline}\n\n/* numeri / prove */\n.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:2px;\n  background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}\n.fact{background:#fff;padding:26px 24px;display:flex;flex-direction:column;gap:7px}\n.fact b{font-family:Archivo,sans-serif;font-size:2.05rem;font-weight:700;color:var(--navy-700);\n  line-height:1;font-variant-numeric:tabular-nums}\n.fact span{font-size:.95rem;color:var(--muted)}\n\n/* metodo */\n.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:2px solid var(--line)}\n.step{padding:26px 22px 0;border-right:1px solid var(--line);position:relative}\n.step:last-child{border-right:0}\n.step::before{content:\"\";position:absolute;top:-2px;left:0;width:38px;height:2px;background:var(--bronze)}\n.step b{display:block;font-family:Archivo,sans-serif;font-size:.74rem;letter-spacing:.14em;\n  text-transform:uppercase;color:var(--bronze);margin-bottom:9px}\n.step h3{margin-bottom:8px}\n.step p{font-size:.97rem}\n\n/* citazione */\n.quote{border-left:3px solid var(--bronze);padding:6px 0 6px 26px;margin:0}\n.quote p{font-family:Archivo,sans-serif;font-size:1.35rem;line-height:1.4;color:var(--ink);font-weight:600}\n.quote cite{display:block;margin-top:12px;font-style:normal;font-size:.93rem;color:var(--muted)}\n\n/* elenco con segno di spunta */\n.check{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:13px}\n.check li{padding-left:30px;position:relative;font-size:1.02rem}\n.check li::before{content:\"\";position:absolute;left:0;top:.55em;width:14px;height:8px;\n  border-left:2.5px solid var(--ok);border-bottom:2.5px solid var(--ok);transform:rotate(-45deg)}\n\n/* soluzioni */\n.sol{display:grid;grid-template-columns:repeat(auto-fit,minmax(246px,1fr));gap:1px;background:var(--line);\n  border:1px solid var(--line);border-radius:12px;overflow:hidden}\n.sol a{background:#fff;padding:24px 22px;text-decoration:none;color:inherit;display:flex;\n  flex-direction:column;gap:8px;transition:background .14s}\n.sol a:hover{background:var(--paper-alt)}\n.sol b{font-family:Archivo,sans-serif;font-size:1.04rem;color:var(--navy-700)}\n.sol span{font-size:.95rem;color:var(--body)}\n.sol em{font-style:normal;font-size:.83rem;color:var(--muted);margin-top:2px}\n\n/* richiamo finale */\n.cta{background:var(--navy-900);color:#fff;padding:66px 0}\n.cta h2{color:#fff;max-width:20ch}\n.cta p{color:#c3d6ee;max-width:56ch;margin-top:14px;font-size:1.1rem}\n.cta .row{display:flex;gap:30px;align-items:center;flex-wrap:wrap;margin-top:26px}\n.cta a.tel{color:#fff;font-family:Archivo,sans-serif;font-weight:600;text-decoration:none;font-size:1.05rem}\n\n/* piede */\nfooter{background:#061426;color:#9db4d1;padding:52px 0 34px;font-size:.95rem}\nfooter .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:36px}\nfooter h4{color:#fff;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}\nfooter a{color:#9db4d1;text-decoration:none;display:block;padding:3px 0}\nfooter a:hover{color:#fff}\nfooter .legal{margin-top:38px;padding-top:20px;border-top:1px solid rgba(255,255,255,.13);\n  display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:.87rem;color:#728ba9}\n\n/* ---------- pagine interne ---------- */\n.phead{background:linear-gradient(160deg,var(--navy-900),var(--navy-700));color:#fff;padding:52px 0 48px}\n.phead h1{color:#fff;max-width:17ch}\n.phead .lead{color:#cfe0f5;max-width:62ch;margin-top:18px}\n.phead .eyebrow{color:#8fc0f2}\n.crumb{font-size:.9rem;color:#8fb2dd;margin-bottom:18px}\n.crumb a{color:#8fb2dd;text-decoration:none}\n.crumb a:hover{color:#fff}\n.prose{max-width:70ch;display:flex;flex-direction:column;gap:20px}\n.prose h2{margin-top:22px}\n.prose h3{margin-top:12px}\n.note{background:var(--bronze-soft);border-left:3px solid var(--bronze);padding:18px 22px;border-radius:0 8px 8px 0;\n  font-size:.99rem}\n.note b{color:var(--ink)}\n.faq{border-top:1px solid var(--line)}\n.faq details{border-bottom:1px solid var(--line);padding:18px 0}\n.faq summary{font-family:Archivo,sans-serif;font-weight:600;font-size:1.05rem;color:var(--ink);cursor:pointer;\n  list-style:none;display:flex;justify-content:space-between;gap:18px}\n.faq summary::after{content:\"+\";color:var(--bronze);font-size:1.4rem;line-height:1}\n.faq details[open] summary::after{content:\"\u2013\"}\n.faq p{margin-top:12px;max-width:70ch}\n\n/* ---------- adattamento agli schermi piccoli ---------- */\n@media (max-width:900px){\n  .two{grid-template-columns:1fr;gap:34px}\n  .pillars .grid{grid-template-columns:1fr}\n  .pillars{margin-top:-18px}\n  .steps{grid-template-columns:1fr 1fr}\n  .step{border-bottom:1px solid var(--line);padding-bottom:22px}\n  footer .cols{grid-template-columns:1fr 1fr}\n}\n@media (max-width:720px){\n  body{font-siz NqTE1Xqrj/wO1tVbh6hvN2wAAAABJRU5ErkJggg==\" alt=\"\"><span><b>Technology Partners<\/b><i>Italia<\/i><\/span><\/a>\n    <button class=\"burger\" id=\"burger\" aria-expanded=\"false\" aria-controls=\"nav\">Menu<\/button>\n    <nav class=\"nav\" id=\"nav\" aria-label=\"Principale\">\n      <a href=\"#aree\">Aree d'impatto<\/a>\n      <a href=\"#soluzioni\">Soluzioni<\/a>\n      <a href=\"#metodo\">Metodo<\/a>\n      <a href=\"azienda.html\">Azienda<\/a>\n      <a href=\"newsnew.html\">News<\/a>\n      <a href=\"modulo.html\" class=\"btn btn-primary\">Parliamone<\/a>\n    <\/nav>\n  <\/div>\n<\/header>\n\n<div class=\"hero\">\n  <div class=\"wrap\">\n    <p class=\"eyebrow\">Consulenza di direzione &middot; Top Partner ERP Zucchetti<\/p>\n    <h1>Non vendiamo licenze. Riduciamo il rischio e rendiamo misurabile il ritorno.<\/h1>\n    <p class=\"lead\">Affianchiamo la direzione nel decidere dove la tecnologia produce margine: automazione\n      predittiva dei processi, continuit\u00e0 operativa garantita, investimenti coperti dagli incentivi.\n      Poi la realizziamo e ne misuriamo il ritorno.<\/p>\n    <div class=\"hero-actions\">\n      <a href=\"modulo.html\" class=\"btn btn-primary\">Prenota un confronto riservato<\/a>\n      <a href=\"#aree\" class=\"btn btn-light\">Le tre aree d'impatto<\/a>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"pillars\">\n  <div class=\"wrap\">\n    <div class=\"grid\">\n      <a class=\"pillar\" href=\"ai.html\">\n        <span class=\"pillar-num\">Area d'impatto 01<\/span>\n        <h3>AI nativa<\/h3>\n        <p>Previsioni di domanda, ritardi di consegna e fermi macchina prima che diventino costi.\n           Intelligenza artificiale dentro i processi che gi\u00e0 usate, non un progetto separato.<\/p>\n        <span class=\"more\">Come si traduce in margine &rarr;<\/span>\n      <\/a>\n      <a class=\"pillar\" href=\"esg.html\">\n        <span class=\"pillar-num\">Area d'impatto 02<\/span>\n        <h3>Sostenibilit\u00e0 ESG<\/h3>\n        <p>Consumi, filiera, sicurezza sul lavoro: misurati dal sistema che gi\u00e0 governa l'operativit\u00e0.\n           Rendicontazione che regge la verifica di banche, clienti e gare.<\/p>\n        <span class=\"more\">Dai dati al bilancio di sostenibilit\u00e0 &rarr;<\/span>\n      <\/a>\n      <a class=\"pillar\" href=\"finanza-agevolata.html\">\n        <span class=\"pillar-num\">Area d'impatto 03<\/span>\n        <h3>Finanza agevolata &middot; Fabbrica 5.0<\/h3>\n        <p>Verifichiamo quali misure coprono il vostro piano, costruiamo il fascicolo tecnico\n           e seguiamo la pratica fino al credito riconosciuto.<\/p>\n        <span class=\"more\">Quanto dell'investimento \u00e8 finanziabile &rarr;<\/span>\n      <\/a>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"creds\">\n  <div class=\"wrap\">\n    <div class=\"creds-head\">\n      <p class=\"eyebrow\">Competenze certificate<\/p>\n      <p>Il livello pi\u00f9 alto della rete Zucchetti, pi\u00f9 undici partnership tecnologiche mantenute nel tempo.<\/p>\n    <\/div>\n    <div class=\"logos\">\n      <img class=\"tall\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAjAAAACaCAYAAAC36XLOAAABhGlDQ1BJQ0MgUHJvZmlsZQAAeJx9kT1Iw1AUhU/TSrVUHOwg4pChOlkQFXXUKhShQqgVWnUweekfNGlIWlwcBdeCgz+LVQcXZ10dXAVB8AfE2cFJ0UVKvC8ptIjxweV9nPfO4b77AKFRZpoVGAM0vWqmEnExk10Vg6/oQYBqGiGZWcacJCXhub7u4eP7XYxned/7c/WqOYsBPpF4lhlmlXiDeGqzanDeJ46woqwSnxOPmtQg8SPXFZffOBccFnhmxEyn5okjxGKhg5UOZkVTI54kjqqaTvlCxmWV8xZnrVxjrT75C8M5fWWZ61RDSGARS5AgQkENJZRRRYx2nRQLKTqPe/gHHb9ELoVcJTByLKACDbLjB/+D37O18hPjblI4DnS92PbHMBDcBZp12/4+tu3mCeB/Bq70tr/SAGY+Sa+3tegR0LcNXFy3NWUPuNwBBp4M2ZQdyU8l5PPA+xl9UxbovwVCa+7cWuc4fQDSNKvkDXBwCIwUKHvd493dnXP7905rfj9NqHKYqHZCzgAAd/1JREFUeNrtvXecHEeZPv68Vd0zs6u4smVbDhhMluCOYHKwzJGOYMKXXTjCwZcgg7FWkv3lyDe7cAmMUTob0B1wYOBASzgwHHDcYfngZ4Ix0RLJAVu2JcuyVmF3Z6a7q97fH121qm11T9qZTer38xmtdnamu6q66q2nnjcB0xBmFubna5j5fPN/iVxyySWXXHLJJZcuiujQ9x8K4GvMfC4RqRzE5JJLLrnkkksucxnAWDkK4GwA32XmVTmIySWXXHLJJZdc5gOAkQBCAA8H8C1mXmlAjM URxr0Pw9JH+f5q6gw+HYGApLA++TZJZPlVZRLCuLZhLPlnKaHjB2OBwbQ2npXmPvYua/RIH2IbnakeJ6hpk/o8+7snI4HH8NpbUzM1/BzKtyrKshZl7EzHOZeZq7gY4U+Ejm2GBKyywlmY7hZVEZwp5UjyGchaj3jLllIg6HYxNTWlVWk8erHG5hOXrRRbRpCuu2/n1FrxtzOBwOh8PhcDgcDofD4XA4HA6Hw+FwOBwOh8PhcDgcDofD4XA4HA6Hw+FwOBwOh8PhcLwM/w+bcC9NR0GOYwAAAABJRU5ErkJggg==\" alt=\"Honeywell\">\n    <\/div>\n  <\/div>\n<\/div>\n\n<section id=\"aree\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <p class=\"eyebrow\">Dove interveniamo<\/p>\n      <h2>Tre decisioni che un amministratore delegato non pu\u00f2 delegare<\/h2>\n      <p class=\"lead\">Non sono tre prodotti. Sono le tre domande su cui, oggi, si gioca il vantaggio\n        competitivo di un'impresa manifatturiera o distributiva: quanto anticipo ho sui problemi,\n        quanto sono verificabili i miei dati, quanto dell'investimento me lo finanzia lo Stato.<\/p>\n    <\/div>\n    <div class=\"cards\">\n      <article class=\"card\">\n        <h3>Il costo di sapere le cose troppo tardi<\/h3>\n        <p>Uno scarto scoperto a fine lotto, un fornitore in ritardo scoperto a magazzino vuoto,\n          un cliente che smette di ordinare e nessuno se ne accorge per un trimestre. Ogni ritardo di\n          informazione \u00e8 un margine gi\u00e0 perso.<\/p>\n        <a href=\"ai.html\">Automazione predittiva &rarr;<\/a>\n      <\/article>\n      <article class=\"card\">\n        <h3>Il costo di non poterlo dimostrare<\/h3>\n        <p>Le banche valutano il rating ESG, i clienti industriali chiedono dati di filiera, i bandi\n          richiedono indicatori certificati. Un dato che non nasce dal sistema gestionale \u00e8 un dato\n          che non regge un audit.<\/p>\n        <a href=\"esg.html\">Dati ESG verificabili &rarr;<\/a>\n      <\/article>\n      <article class=\"card\">\n        <h3>Il costo di pagarlo tutto da soli<\/h3>\n        <p>Buona parte degli investimenti in digitalizzazione e in efficienza produttiva rientra in\n          misure agevolative. La differenza tra ottenerle e no non sta nel software: sta in come il\n          progetto viene impostato e documentato fin dall'inizio.<\/p>\n        <a href=\"finanza-agevolata.html\">Finanza agevolata &rarr;<\/a>\n      <\/article>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"alt\" id=\"metodo\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <p class=\"eyebrow\">Come lavoriamo<\/p>\n      <h2>Prima il business case. Poi il software.<\/h2>\n      <p class=\"lead\">L'ordine non \u00e8 un dettaglio di metodo: \u00e8 ci\u00f2 che distingue un investimento da un\n        acquisto. Nessun progetto parte senza un numero da raggiungere e un modo per verificarlo.<\/p>\n    <\/div>\n    <div class=\"steps\">\n      <div class=\"step\">\n        <b>Fase 01<\/b><h3>Assessment<\/h3>\n        <p>Due settimane con chi lavora nei processi. Ne esce la mappa di dove si perdono tempo,\n          margine e informazioni \u2014 con l'ordine di grandezza di ciascuna perdita.<\/p>\n      <\/div>\n      <div class=\"step\">\n        <b>Fase 02<\/b><h3>Business case<\/h3>\n        <p>Che cosa costa intervenire, che cosa si recupera, in quanto tempo, quanta parte \u00e8 coperta\n          da incentivi. Un documento che la direzione pu\u00f2 portare in consiglio.<\/p>\n      <\/div>\n      <div class=\"step\">\n        <b>Fase 03<\/b><h3>Realizzazione<\/h3>\n        <p>Rilasci brevi, in produzione, con le persone formate. Un referente unico che risponde\n          del progetto, non un ticket che rimbalza tra fornitori.<\/p>\n      <\/div>\n      <div class=\"step\">\n        <b>Fase 04<\/b><h3>Misura<\/h3>\n        <p>Gli indicatori concordati all'inizio, verificati a sei e dodici mesi. Se il ritorno non\n          c'\u00e8, si interviene: \u00e8 parte del mandato, non un extra.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"wrap two\">\n    <div>\n      <p class=\"eyebrow\">Perch\u00e9 noi<\/p>\n      <h2>Dagli anni '80 dentro i processi aziendali, non su un catalogo di licenze<\/h2>\n      <p class=\"lead\" style=\"margin-top:18px\">Nata negli anni '80 per distribuire applicativi gestionali,\n        Technology Partners Italia \u00e8 diventata quello che i suoi clienti le hanno chiesto di essere:\n        un interlocutore che conosce il processo prima del prodotto. \u00c8 la ragione per cui Zucchetti,\n        riorganizzando la rete distributiva per livelli di competenza certificata, ci ha collocati al vertice.<\/p>\n      <ul class=\"check\" style=\"margin-top:26px\">\n        <li><b>Top Partner ERP Zucchetti<\/b> \u2014 il livello pi\u00f9 alto della rete, dopo sei anni\n          consecutivi (2016-2022) come Centro di Competenza Infinity.<\/li>\n        <li><b>Software sviluppato in casa<\/b> \u2014 EasyTime ed EasyInd, il MES esteso che raccoglie\n          tempi, fermi e scarti dalle macchine: scritti da noi e integrati nel gestionale,\n          non adattati a posteriori.<\/li>\n        <li><b>Un solo interlocutore<\/b> \u2014 gestionale, infrastruttura, sicurezza e rete rispondono\n          allo stesso referente. Nessun rimpallo tra fornitori quando qualcosa si ferma.<\/li>\n      <\/ul>\n      <p style=\"margin-top:26px\"><a href=\"azienda.html\" class=\"btn btn-ghost\">Chi siamo<\/a><\/p>\n    <\/div>\n    <div>\n      <blockquote class=\"quote\">\n        <p>&ldquo;Dare l'informazione giusta alla persona giusta, nel momento giusto, per prendere\n          la giusta decisione.&rdquo;<\/p>\n        <cite>Michael E. Porter, Harvard Business School \u2014 la frase che sintetizza ogni nostro incarico<\/cite>\n      <\/blockquote>\n      <div class=\"facts\" style=\"margin-top:32px\">\n        <div class=\"fact\"><b>anni '80<\/b><span>da quando ci occupiamo di sistemi gestionali<\/span><\/div>\n        <div class=\"fact\"><b>2016<\/b><span>primo riconoscimento come Centro di Competenza Infinity<\/span><\/div>\n        <div class=\"fact\"><b>Top Partner<\/b><span>il livello di partnership Zucchetti che abbiamo oggi<\/span><\/div>\n        <div class=\"fact\"><b>11<\/b><span>partnership tecnologiche certificate e attive<\/span><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"alt\" id=\"soluzioni\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <p class=\"eyebrow\">Che cosa mettiamo in campo<\/p>\n      <h2>Gli strumenti, dopo la decisione<\/h2>\n      <p class=\"lead\">Sono la parte esecutiva, e li conosciamo fino in fondo. Ma vengono scelti alla fine\n        del ragionamento, non all'inizio.<\/p>\n    <\/div>\n    <div class=\"sol\">\n      <a href=\"gestionalix.html\"><b>Sistema gestionale ERP<\/b><span>Il centro informativo dell'azienda:\n        amministrazione, vendite, acquisti, magazzino, produzione.<\/span><em>Mago4 &middot; Ad Hoc Infinity &middot; Infinity<\/em><\/a>\n      <a href=\"crm.html\"><b>Relazione con il cliente<\/b><span>Prevendita, vendita e post-vendita in un unico\n        flusso, con il valore di ogni cliente sempre visibile.<\/span><em>CRM &middot; portali &middot; e-commerce<\/em><\/a>\n      <a href=\"easytime.html\"><b>Fabbrica connessa<\/b><span>Tempi, fermi, scarti e qualit\u00e0 raccolti dalle\n        macchine in tempo reale e riportati a costo.<\/span><em>EasyTime &middot; EasyInd &middot; Opera MES<\/em><\/a>\n      <a href=\"wapp.html\"><b>Logistica di magazzino<\/b><span>Ubicazioni, missioni, tracciabilit\u00e0:\n        meno errori di prelievo, inventari che tornano.<\/span><em>W.App WMS &middot; RFID &middot; Zebra<\/em><\/a>\n      <a href=\"dms.html\"><b>Documenti e conservazione<\/b><span>Fatturazione elettronica, archiviazione a\n        norma, processi approvativi tracciati.<\/span><em>DMS &middot; conservazione sostitutiva<\/em><\/a>\n      <a href=\"sistemi.html\"><b>Continuit\u00e0 e sicurezza<\/b><span>Server, cloud, backup, disaster recovery e\n        difesa perimetrale: perch\u00e9 il resto possa funzionare.<\/span><em>Azure &middot; VMware &middot; Fortinet &middot; HPE<\/em><\/a>\n    <\/div>\n  <\/div>\n<\/section>\n\n<div class=\"cta\">\n  <div class=\"wrap\">\n    <h2>Un'ora con la direzione, prima di qualsiasi preventivo.<\/h2>\n    <p>Ci racconta dove l'azienda perde tempo e margine. Le diciamo se e come la tecnologia\n      pu\u00f2 recuperarli, quanto costa e quanta parte \u00e8 finanziabile. Senza impegno e senza demo di prodotto.<\/p>\n    <div class=\"row\">\n      <a href=\"modulo.html\" class=\"btn btn-primary\">Richiedi il confronto<\/a>\n      <a class=\"tel\" href=\"tel:+390362163629\">+39 0362 1636293<\/a>\n      <a class=\"tel\" href=\"mailto:commerciale@tp-italia.com\">commerciale@tp-italia.com<\/a>\n    <\/div>\n  <\/div>\n<\/div>\n\n<footer>\n  <div class=\"wrap\">\n    <div class=\"cols\">\n      <div>\n        <h4>Technology Partners Italia<\/h4>\n        <p>Via Vincenzo Monti, 74<br>20832 Desio (MB)<br>Tel +39 0362 1636293<br>\n          <a href=\"mailto:commerciale@tp-italia.com\">commerciale@tp-italia.com<\/a><\/p>\n      <\/div>\n      <div>\n        <h4>Aree d'impatto<\/h4>\n        <a href=\"ai.html\">AI nativa<\/a>\n        <a href=\"esg.html\">Sostenibilit\u00e0 ESG<\/a>\n        <a href=\"finanza-agevolata.html\">Finanza agevolata 5.0<\/a>\n      <\/div>\n      <div>\n        <h4>Soluzioni<\/h4>\n        <a href=\"gestionalix.html\">Sistema gestionale ERP<\/a>\n        <a href=\"crm.html\">CRM e portali<\/a>\n        <a href=\"easytime.html\">Fabbrica connessa<\/a>\n        <a href=\"wapp.html\">Logistica di magazzino<\/a>\n        <a href=\"sistemi.html\">Continuit\u00e0 e sicurezza<\/a>\n      <\/div>\n      <div>\n        <h4>Azienda<\/h4>\n        <a href=\"azienda.html\">Chi siamo<\/a>\n        <a href=\"newsnew.html\">News<\/a>\n        <a href=\"lavoraconnoi.html\">Lavora con noi<\/a>\n        <a href=\"indicazioni.html\">Dove siamo<\/a>\n        <a href=\"modulo.html\">Contatti<\/a>\n      <\/div>\n    <\/div>\n    <div class=\"legal\">\n      <span>Technology Partners Italia margin-top:auto}\n.card a:hover{text-decoration:underline}\n\n/* numeri / prove */\n.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:2px;\n  background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}\n.fact{background:#fff;padding:26px 24px;display:flex;flex-direction:column;gap:7px}\n.fact b{font-family:Archivo,sans-serif;font-size:2.05rem;font-weight:700;color:var(--navy-700);\n  line-height:1;font-variant-numeric:tabular-nums}\n.fact span{font-size:.95rem;color:var(--muted)}\n\n/* metodo */\n.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:2px solid var(--line)}\n.step{padding:26px 22px 0;border-right:1px solid var(--line);position:relative}\n.step:last-child{border-right:0}\n.step::before{content:\"\";position:absolute;top:-2px;left:0;width:38px;height:2px;background:var(--bronze)}\n.step b{display:block;font-family:Archivo,sans-serif;font-size:.74rem;letter-spacing:.14em;\n  text-transform:uppercase;color:var(--bronze);margin-bottom:9px}\n.step h3{margin-bottom:8px}\n.step p{font-size:.97rem}\n\n/* citazione */\n.quote{border-left:3px solid var(--bronze);padding:6px 0 6px 26px;margin:0}\n.quote p{font-family:Archivo,sans-serif;font-size:1.35rem;line-height:1.4;color:var(--ink);font-weight:600}\n.quote cite{display:block;margin-top:12px;font-style:normal;font-size:.93rem;color:var(--muted)}\n\n/* elenco con segno di spunta */\n.check{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:13px}\n.check li{padding-left:30px;position:relative;font-size:1.02rem}\n.check li::before{content:\"\";position:absolute;left:0;top:.55em;width:14px;height:8px;\n  border-left:2.5px solid var(--ok);border-bottom:2.5px solid var(--ok);transform:rotate(-45deg)}\n\n/* soluzioni */\n.sol{display:grid;grid-template-columns:repeat(auto-fit,minmax(246px,1fr));gap:1px;background:var(--line);\n  border:1px solid var(--line);border-radius:12px;overflow:hidden}\n.sol a{background:#fff;padding:24px 22px;text-decoration:none;color:inherit;display:flex;\n  flex-direction:column;gap:8px;transition:background .14s}\n.sol a:hover{background:var(--paper-alt)}\n.sol b{font-family:Archivo,sans-serif;font-size:1.04rem;color:var(--navy-700)}\n.sol span{font-size:.95rem;color:var(--body)}\n.sol em{font-style:normal;font-size:.83rem;color:var(--muted);margin-top:2px}\n\n/* richiamo finale */\n.cta{background:var(--navy-900);color:#fff;padding:66px 0}\n.cta h2{color:#fff;max-width:20ch}\n.cta p{color:#c3d6ee;max-width:56ch;margin-top:14px;font-size:1.1rem}\n.cta .row{display:flex;gap:30px;align-items:center;flex-wrap:wrap;margin-top:26px}\n.cta a.tel{color:#fff;font-family:Archivo,sans-serif;font-weight:600;text-decoration:none;font-size:1.05rem}\n\n/* piede */\nfooter{background:#061426;color:#9db4d1;padding:52px 0 34px;font-size:.95rem}\nfooter .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:36px}\nfooter h4{color:#fff;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}\nfooter a{color:#9db4d1;text-decoration:none;display:block;padding:3px 0}\nfooter a:hover{color:#fff}\nfooter .legal{margin-top:38px;padding-top:20px;border-top:1px solid rgba(255,255,255,.13);\n  display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:.87rem;color:#728ba9}\n\n/* ---------- pagine interne ---------- */\n.phead{background:linear-gradient(160deg,var(--navy-900),var(--navy-700));color:#fff;padding:52px 0 48px}\n.phead h1{color:#fff;max-width:17ch}\n.phead .lead{color:#cfe0f5;max-width:62ch;margin-top:18px}\n.phead .eyebrow{color:#8fc0f2}\n.crumb{font-size:.9rem;color:#8fb2dd;margin-bottom:18px}\n.crumb a{color:#8fb2dd;text-decoration:none}\n.crumb a:hover{color:#fff}\n.prose{max-width:70ch;display:flex;flex-direction:column;gap:20px}\n.prose h2{margin-top:22px}\n.prose h3{margin-top:12px}\n.note{background:var(--bronze-soft);border-left:3px solid var(--bronze);padding:18px 22px;border-radius:0 8px 8px 0;\n  font-size:.99rem}\n.note b{color:var(--ink)}\n.faq{border-top:1px solid var(--line)}\n.faq details{border-bottom:1px solid var(--line);padding:18px 0}\n.faq summary{font-family:Archivo,sans-serif;font-weight:600;font-size:1.05rem;color:var(--ink);cursor:pointer;\n  list-style:none;display:flex;justify-content:space-between;gap:18px}\n.faq summary::after{content:\"+\";color:var(--bronze);font-size:1.4rem;line-height:1}\n.faq details[open] summary::after{content:\"\u2013\"}\n.faq p{margin-top:12px;max-width:70ch}\n\n/* ---------- adattamento agli schermi piccoli ---------- */\n@media (max-width:900px){\n  .two{grid-template-columns:1fr;gap:34px}\n  .pillars .grid{grid-template-columns:1fr}\n  .pillars{margin-top:-18px}\n  .steps{grid-template-columns:1fr 1fr}\n  .step{border-bottom:1px solid var(--line);padding-bottom:22px}\n  footer .cols{grid-template-columns:1fr 1fr}\n}\n@media (max-width:720px){\n  body{font-size:16px}\n  .nav{display:none;position:absolute;top:76px;left:0;right:0;background:#fff;flex-direction:column;\n    align-items:stretch;gap:0;padding:8px 24px 18px;border-bottom:1px solid var(--line);\n    box-shadow:0 18px 30px -20px rgba(8,25,47,.5)}\n  .nav.open{display:flex}\n  .nav a{padding:12px 0;border-bottom:1px solid var(--line)}\n  .nav .btn{margin-top:12px;justify-content:center}\n  .burger{display:block}\n  .top .wrap{position:relative}\n  section{padding:52px 0}\n  .hero .wrap{padding-top:40px}\n  .steps{grid-template-columns:1fr}\n  footer .cols{grid-template-columns:1fr}\n}\n\n<\/style>\n<\/head>\n<body>\n\n<header class=\"top\">\n  <div class=\"wrap\">\n    <a class=\"brandlock\" href=\"index.html\" aria-label=\"Technology Partners Italia, home\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAKAAAACgCAYAAACLz2ctAABY4UlEQVR42u29eZwdVZk3/n3OOVV1t967k3QSkhCykB0DyKIjqKgzKrh2dBydV2eR0UEW0VFfhZtWQVAZIEEdnHkddZx3nGRUlsFRx1fBBZA1CUlDQva109vt5W61nPP8/jh1u293upMO4vwS6POhPx361q06depbz/J9lgNMjakxNabG1JgaU2NqTI2pMTWmxtQ4rQYBTPb31HgBizc1TrxGWWprW0ZAG C/RMNzUwAlz82g8CiSbzb4YpguNl+3ycsiAeTmO6pQqjAMosWHDBjnRMZXP29raZAWQzExjwVuVqkUnc+22tja5YcOG8c5NU49uakyNqTE1Xqrj/wO1tVbh6hvN2wAAAABJRU5ErkJggg==\" alt=\"\"><span><b>Technology Partners<\/b><i>Italia<\/i><\/span><\/a>\n    <button class=\"burger\" id=\"burger\" aria-expanded=\"false\" aria-controls=\"nav\">Menu<\/button>\n    <nav class=\"nav\" id=\"nav\" aria-label=\"Principale\">\n      <a href=\"ai.html\" aria-current=\"page\">AI nativa<\/a>\n      <a href=\"esg.html\">ESG<\/a>\n      <a href=\"finanza-agevolata.html\">Finanza agevolata<\/a>\n      <a href=\"index.html#soluzioni\">Soluzioni<\/a>\n      <a href=\"azienda.html\">Azienda<\/a>\n      <a href=\"modulo.html\" class=\"btn btn-primary\">Parliamone<\/a>\n    <\/nav>\n  <\/div>\n<\/header>\n\n<div class=\"phead\">\n  <div class=\"wrap\">\n    <p class=\"crumb\"><a href=\"index.html\">Home<\/a> &rsaquo; Aree d'impatto &rsaquo; AI nativa<\/p>\n    <p class=\"eyebrow\">Area d'impatto 01<\/p>\n    <h1>L'automazione predittiva vale solo se cambia una decisione<\/h1>\n    <p class=\"lead\">Anticipare un problema di qualche settimana vale pi&ugrave; di qualsiasi cruscotto. Portiamo le funzioni predittive dentro i sistemi che governano gi&agrave; la vostra operativit&agrave;, con un indicatore di ritorno concordato prima di partire.<\/p>\n  <\/div>\n<\/div>\n\n<section>\n  <div class=\"wrap two\">\n    <div class=\"prose\">\n      <p class=\"lead\">Quasi tutte le aziende hanno gi&agrave; i dati che servirebbero per prevedere.\n        Sono negli ordini, nei consumi delle macchine, nello storico degli incassi, nei ticket di assistenza.\n        Il problema non &egrave; raccoglierli: &egrave; che nessuno li guarda in tempo per decidere diversamente.<\/p>\n      <p>L'automazione predittiva serve a questo e a nient'altro: portare un'informazione sul tavolo\n        quando la decisione &egrave; ancora possibile. Un fornitore che sta scivolando sui tempi va saputo\n        prima che fermi la linea. Un cliente che riduce la frequenza d'ordine va saputo prima che smetta.\n        Una macchina che sta degradando va saputa prima del guasto, non dopo.<\/p>\n      <h2>&laquo;Nativa&raquo; significa dentro i processi che gi&agrave; usate<\/h2>\n      <p>La differenza rispetto a un progetto di intelligenza artificiale tradizionale &egrave; tutta qui.\n        Non si costruisce un data lake, non si assume un data scientist, non si aspettano diciotto mesi:\n        le funzioni predittive vivono dentro il gestionale, il MES e il CRM che governano gi&agrave;\n        l'operativit&agrave;, e producono un avviso dove la persona sta gi&agrave; lavorando.<\/p>\n      <p>&Egrave; anche la ragione per cui funziona: un modello che gira su dati sporchi o parziali\n        produce previsioni che nessuno crede. Prima si sistema il flusso informativo, poi si predice.\n        Il primo pezzo di lavoro &egrave; quasi sempre il pi&ugrave; noioso, ed &egrave; quello che decide il risultato.<\/p>\n    <\/div>\n    <div>\n      <div class=\"note\">\n        <p><b>Il criterio che usiamo.<\/b> Una funzione predittiva entra in progetto solo se\n          risponde a tre domande: quale decisione cambia, chi la prende, con quanto anticipo.\n          Se una delle tre resta senza risposta, non la mettiamo in campo &mdash; per quanto sia\n          tecnicamente affascinante.<\/p>\n      <\/div>\n      <div class=\"facts\" style=\"margin-top:26px\">\n        <div class=\"fact\"><b>Domanda<\/b><span>previsione di vendita e riordino: meno rotture di stock,\n          meno capitale immobilizzato a magazzino<\/span><\/div>\n        <div class=\"fact\"><b>Fabbrica<\/b><span>degrado macchina e colli di bottiglia riconosciuti\n          dai dati raccolti in reparto<\/span><\/div>\n        <div class=\"fact\"><b>Credito<\/b><span>scoring dei comportamenti di pagamento: si interviene\n          sull'insoluto prima che diventi tale<\/span><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"alt\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <p class=\"eyebrow\">Dove interviene per prima<\/p>\n      <h2>Quattro punti in cui l'anticipo si trasforma subito in margine<\/h2>\n    <\/div>\n    <div class=\"cards\">\n      <article class=\"card\">\n        <h3>Pianificazione della domanda<\/h3>\n        <p>Lo storico degli ordini, la stagionalit&agrave; e il portafoglio aperto producono una previsione\n          per articolo. Serve a decidere che cosa riordinare e in che quantit&agrave;: meno mancanti sui\n          codici che vendono, meno giacenza morta su quelli che non vendono.<\/p>\n      <\/article>\n      <article class=\"card\">\n        <h3>Manutenzione predittiva<\/h3>\n        <p>Contatori, tempi ciclo e allarmi raccolti dalle macchine interconnesse mostrano il degrado\n          prima del fermo. La manutenzione si programma in finestra utile invece di subirla nel\n          momento peggiore.<\/p>\n      <\/article>\n      <article class=\"card\">\n        <h3>Qualit&agrave; e scarti<\/h3>\n        <p>Gli scarti dichiarati in reparto, incrociati con lotto, macchina e operatore, fanno emergere\n          la combinazione che li genera. &Egrave; il tipo di correlazione che a occhio non si vede\n          e che a fine anno pesa in bilancio.<\/p>\n      <\/article>\n      <article class=\"card\">\n        <h3>Documenti e anomalie<\/h3>\n        <p>Fatture passive, ordini e bolle letti automaticamente: il sistema segnala ci&ograve; che non torna\n          &mdash; prezzo diverso dal contratto, quantit&agrave; non corrispondente, doppio pagamento &mdash;\n          invece di farlo scoprire alla chiusura.<\/p>\n      <\/article>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <p class=\"eyebrow\">Come si verifica<\/p>\n      <h2>Indicatori che concordiamo prima di partire<\/h2>\n      <p class=\"lead\">Sono quelli che finiscono nel business case e che rivediamo insieme a sei e\n        dodici mesi. Se non si muovono, il progetto ha un problema e va affrontato.<\/p>\n    <\/div>\n    <ul class=\"check\" style=\"max-width:74ch\">\n      <li><b>Giorni di anticipo<\/b> con cui un problema viene riconosciuto rispetto a oggi.<\/li>\n      <li><b>Rotture di stock<\/b> sui codici a maggior rotazione, e capitale immobilizzato a magazzino.<\/li>\n      <li><b>Ore di fermo non pianificato<\/b> e loro incidenza sulla capacit&agrave; produttiva.<\/li>\n      <li><b>Giorni medi di incasso<\/b> e quota di credito scaduto.<\/li>\n      <li><b>Ore/persona<\/b> sottratte al controllo manuale dei documenti.<\/li>\n    <\/ul>\n  <\/div>\n<\/section>\n<section class=\"alt\"><div class=\"wrap\"><div class=\"sec-head\"><p class=\"eyebrow\">Domande ricorrenti<\/p><h2>Quello che ci chiedono prima di iniziare<\/h2><\/div><div class=\"faq\">\n<details><summary>Serve avere gi&agrave; un gestionale evoluto?<\/summary><p>Serve avere dati affidabili, che &egrave; una cosa diversa. L'assessment iniziale verifica proprio questo: se i dati che gi&agrave; producete sono sufficienti, se vanno prima ripuliti o se manca la rilevazione alla fonte. In diversi casi il primo intervento utile non &egrave; l'intelligenza artificiale, ma chiudere il buco informativo che la rende impossibile.<\/p><\/details>\n<details><summary>Quanto dura un primo progetto?<\/summary><p>Un ambito alla volta, con un rilascio in produzione entro poche settimane. Preferiamo un risultato verificabile su un processo solo piuttosto che un programma annuale che nessuno riesce a giudicare finch&eacute; non &egrave; finito.<\/p><\/details>\n<details><summary>I nostri dati restano nostri?<\/summary><p>S&igrave;. Definiamo in contratto dove risiedono i dati, chi vi accede e per quale finalit&agrave;. &Egrave; il primo punto che mettiamo per iscritto, prima ancora dell'architettura tecnica.<\/p><\/details>\n<details><summary>Che cosa succede se la previsione sbaglia?<\/summary><p>Ogni previsione arriva con il proprio margine d'errore, ed &egrave; questo che la rende utilizzabile: chi decide sa quanto fidarsi. Un modello che non dichiara la propria incertezza non &egrave; uno strumento di direzione.<\/p><\/details>\n<\/div><\/div><\/section>\n<div class=\"cta\">\n  <div class=\"wrap\">\n    <h2>Quanto anticipo vi manca oggi?<\/h2>\n    <p>Un'ora con la direzione basta per capire dove l'informazione arriva troppo tardi e quanto costa. Da l&igrave; si vede subito se l'automazione predittiva ha senso per voi, o se prima va sistemato altro.<\/p>\n    <div class=\"row\">\n      <a href=\"modulo.html\" class=\"btn btn-primary\">Richiedi il confronto<\/a>\n      <a class=\"tel\" href=\"tel:+390362163629\">+39 0362 1636293<\/a>\n      <a class=\"tel\" href=\"mailto:commerciale@tp-italia.com\">commerciale@tp-italia.com<\/a>\n    <\/div>\n  <\/div>\n<\/div>\n\n<footer>\n  <div class=\"wrap\">\n    <div class=\"cols\">\n      <div>\n        <h4>Technology Partners Italia<\/h4>\n        <p>Via Vincenzo Monti, 74<br>20832 Desio (MB)<br>Tel +39 0362 1636293<br>\n          <a href=\"mailto:commerciale@tp-italia.com\">commerciale@tp-italia.com<\/a><\/p>\n      <\/div>\n      <div>\n        <h4>Aree d'impatto<\/h4>\n        <a href=\"ai.html\">AI nativa<\/a>\n        <a href=\"esg.html\">Sostenibilit&agrave; ESG<\/a>\n        <a href=\"finanza-agevolata.html\">Finanza agevolata 5.0<\/a>\n      <\/div>\n      <div>\n        <h4>Soluzioni<\/h4>\n        <a href=\"gestionalix.html\">Sistema gestionale ERP<\/a>\n        <a href=\"crm.html\">CRM e portali<\/a>\n        <a href=\"easytime.html\">Fabbrica connessa<\/a>\n        <a href=\"wapp.html\">Logistica di magazzino<\/a>\n        <a href=\"sistemi.html\">Continuit&agrave; e sicurezza<\/a>\n      <\/div>\n      <div>\n        <h4>Azienda<\/h4>\n        <a href=\"azienda.html\">Chi siamo<\/a>\n        <a href=\"newsnew.html\">News<\/a>\n        <a href=\"lavoraconnoi.html\">Lavora con noi<\/a>\n        <a href=\"indicazioni.html\">Dove siamo<\/a>\n order-radius:14px;padding:24px 22px 20px;\n  box-shadow:0 14px 38px -22px rgba(8,25,47,.55);display:flex;flex-direction:column;gap:10px;\n  text-decoration:none;color:inherit;border-top:4px solid var(--navy-500);transition:transform .16s,box-shadow .16s}\n.pillar:hover{transform:translateY(-3px);box-shadow:0 20px 44px -20px rgba(8,25,47,.6)}\n.pillar:nth-child(2){border-top-color:var(--ok)}\n.pillar:nth-child(3){border-top-color:var(--bronze)}\n.pillar h3{font-size:1.28rem}\n.pillar p{font-size:.99rem;color:var(--body)}\n.pillar .more{margin-top:auto;font-family:Archivo,sans-serif;font-weight:600;font-size:.92rem;color:var(--navy-500)}\n.pillar-num{font-family:Archivo,sans-serif;font-size:.72rem;font-weight:600;letter-spacing:.14em;\n  text-transform:uppercase;color:var(--muted)}\n\n/* ---------- fascia credenziali ---------- */\n.creds{background:var(--paper-alt);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:30px 0}\n.creds-head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:20px}\n.creds-head p{font-size:.97rem;color:var(--muted)}\n.logos{display:flex;flex-wrap:wrap;align-items:center;gap:34px;justify-content:center}\n.logos img{height:30px;width:auto;opacity:.62;filter:grayscale(1);transition:opacity .15s,filter .15s}\n.logos img:hover{opacity:1;filter:none}\n.logos img.tall{height:44px}\n\n/* ---------- sezioni ---------- */\nsection{padding:74px 0}\nsection.alt{background:var(--paper-alt);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}\n.sec-head{max-width:62ch;margin-bottom:40px;display:flex;flex-direction:column;gap:14px}\n.two{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:start}\n.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:22px}\n.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px 24px;\n  display:flex;flex-direction:column;gap:11px}\n.card h3{color:var(--navy-700)}\n.card p{font-size:1rem}\n.card a{font-family:Archivo,sans-serif;font-weight:600;font-size:.93rem;text-decoration:none;margin-top:auto}\n.card a:hover{text-decoration:underline}\n\n/* numeri / prove */\n.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:2px;\n  background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}\n.fact{background:#fff;padding:26px 24px;display:flex;flex-direction:column;gap:7px}\n.fact b{font-family:Archivo,sans-serif;font-size:2.05rem;font-weight:700;color:var(--navy-700);\n  line-height:1;font-variant-numeric:tabular-nums}\n.fact span{font-size:.95rem;color:var(--muted)}\n\n/* metodo */\n.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:2px solid var(--line)}\n.step{padding:26px 22px 0;border-right:1px solid var(--line);position:relative}\n.step:last-child{border-right:0}\n.step::before{content:\"\";position:absolute;top:-2px;left:0;width:38px;height:2px;background:var(--bronze)}\n.step b{display:block;font-family:Archivo,sans-serif;font-size:.74rem;letter-spacing:.14em;\n  text-transform:uppercase;color:var(--bronze);margin-bottom:9px}\n.step h3{margin-bottom:8px}\n.step p{font-size:.97rem}\n\n/* citazione */\n.quote{border-left:3px solid var(--bronze);padding:6px 0 6px 26px;margin:0}\n.quote p{font-family:Archivo,sans-serif;font-size:1.35rem;line-height:1.4;color:var(--ink);font-weight:600}\n.quote cite{display:block;margin-top:12px;font-style:normal;font-size:.93rem;color:var(--muted)}\n\n/* elenco con segno di spunta */\n.check{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:13px}\n.check li{padding-left:30px;position:relative;font-size:1.02rem}\n.check li::before{content:\"\";position:absolute;left:0;top:.55em;width:14px;height:8px;\n  border-left:2.5px solid var(--ok);border-bottom:2.5px solid var(--ok);transform:rotate(-45deg)}\n\n/* soluzioni */\n.sol{display:grid;grid-template-columns:repeat(auto-fit,minmax(246px,1fr));gap:1px;background:var(--line);\n  border:1px solid var(--line);border-radius:12px;overflow:hidden}\n.sol a{background:#fff;padding:24px 22px;text-decoration:none;color:inherit;display:flex;\n  flex-direction:column;gap:8px;transition:background .14s}\n.sol a:hover{background:var(--paper-alt)}\n.sol b{font-family:Archivo,sans-serif;font-size:1.04rem;color:var(--navy-700)}\n.sol span{font-size:.95rem;color:var(--body)}\n.sol em{font-style:normal;font-size:.83rem;color:var(--muted);margin-top:2px}\n\n/* richiamo finale */\n.cta{background:var(--navy-900);color:#fff;padding:66px 0}\n.cta h2{color:#fff;max-width:20ch}\n.cta p{color:#c3d6ee;max-width:56ch;margin-top:14px;font-size:1.1rem}\n.cta .row{display:flex;gap:30px;align-items:center;flex-wrap:wrap;margin-top:26px}\n.cta a.tel{color:#fff;font-family:Archivo,sans-serif;font-weight:600;text-decoration:none;font-size:1.05rem}\n\n/* piede */\nfooter{background:#061426;color:#9db4d1;padding:52px 0 34px;font-size:.95rem}\nfooter .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:36px}\nfooter h4{color:#fff;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}\nfooter a{color:#9db4d1;text-decoration:none;display:block;padding:3px 0}\nfooter a:hover{color:#fff}\nfooter .legal{margin-top:38px;padding-top:20px;border-top:1px solid rgba(255,255,255,.13);\n  display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:.87rem;color:#728ba9}\n\n/* ---------- pagine interne ---------- */\n.phead{background:linear-gradient(160deg,var(--navy-900),var(--navy-700));color:#fff;padding:52px 0 48px}\n.phead h1{color:#fff;max-width:17ch}\n.phead .lead{color:#cfe0f5;max-width:62ch;margin-top:18px}\n.phead .eyebrow{color:#8fc0f2}\n.crumb{font-size:.9rem;color:#8fb2dd;margin-bottom:18px}\n.crumb a{color:#8fb2dd;text-decoration:none}\n.crumb a:hover{color:#fff}\n.prose{max-width:70ch;display:flex;flex-direction:column;gap:20px}\n.prose h2{margin-top:22px}\n.prose h3{margin-top:12px}\n.note{background:var(--bronze-soft);border-left:3px solid var(--bronze);padding:18px 22px;border-radius:0 8px 8px 0;\n  font-size:.99rem}\n.note b{color:var(--ink)}\n.faq{border-top:1px solid var(--line)}\n.faq details{border-bottom:1px solid var(--line);padding:18px 0}\n.faq summary{font-family:Archivo,sans-serif;font-weight:600;font-size:1.05rem;color:var(--ink);cursor:pointer;\n  list-style:none;display:flex;justify-content:space-between;gap:18px}\n.faq summary::after{content:\"+\";color:var(--bronze);font-size:1.4rem;line-height:1}\n.faq details[open] summary::after{content:\"\u2013\"}\n.faq p{margin-top:12px;max-width:70ch}\n\n/* ---------- adattamento agli schermi piccoli ---------- */\n@media (max-width:900px){\n  .two{grid-template-columns:1fr;gap:34px}\n  .pillars .grid{grid-template-columns:1fr}\n  .pillars{margin-top:-18px}\n  .steps{grid-template-columns:1fr 1fr}\n  .step{border-bottom:1px solid var(--line);padding-bottom:22px}\n  footer .cols{grid-template-columns:1fr 1fr}\n}\n@media (max-width:720px){\n  body{font-size:16px}\n  .nav{display:none;position:absolute;top:76px;left:0;right:0;background:#fff;flex-direction:column;\n    align-items:stretch;gap:0;padding:8px 24px 18px;border-bottom:1px solid var(--line);\n    box-shadow:0 18px 30px -20px rgba(8,25,47,.5)}\n  .nav.open{display:flex}\n  .nav a{padding:12px 0;border-bottom:1px solid var(--line)}\n  .nav .btn{margin-top:12px;justify-content:center}\n  .burger{display:block}\n  .top .wrap{position:relative}\n  section{padding:52px 0}\n  .hero .wrap{padding-top:40px}\n  .steps{grid-template-columns:1fr}\n  footer .cols{grid-template-columns:1fr}\n}\n\n<\/style>\n<\/head>\n<body>\n\n<header class=\"top\">\n  <div class=\"wrap\">\n    <a class=\"brandlock\" href=\"index.html\" aria-label=\"Technology Partners Italia, home\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAKAAAACgCAYAAACLz2ctAABY4UlEQVR42u29eZwdVZk3/n3OOVV1t967k3QSkhCykB0DyKIjqKgzKrh2dBydV2eR0UEW0VFfhZtWQVAZIEEdnHkddZx3nGRUlsFRx1fBBZA1CUlDQva109vt5W61nPP8/jh1 hS+cIYSY09/fv+UrX/nKEAB85jOfaWloaFgUhuGOOKQ2anzhC184g5lXGWPSURRt/eIXv7jtpptumg5gweDg4NZbb711AC/RMNzUwAlz82g8CiSbzb4YpguNl+3ycsiAeTmO6pQqjAMosWHDBjnRMZXP29raZAWQzExjwVuVqkUnc+22tja5YcOG8c5NU49uakyNqTE1Xqrj/wO1tVbh6hvN2wAAAABJRU5ErkJggg==\" alt=\"\"><span><b>Technology Partners<\/b><i>Italia<\/i><\/span><\/a>\n    <button class=\"burger\" id=\"burger\" aria-expanded=\"false\" aria-controls=\"nav\">Menu<\/button>\n    <nav class=\"nav\" id=\"nav\" aria-label=\"Principale\">\n      <a href=\"ai.html\">AI nativa<\/a>\n      <a href=\"esg.html\" aria-current=\"page\">ESG<\/a>\n      <a href=\"finanza-agevolata.html\">Finanza agevolata<\/a>\n      <a href=\"index.html#soluzioni\">Soluzioni<\/a>\n      <a href=\"azienda.html\">Azienda<\/a>\n      <a href=\"modulo.html\" class=\"btn btn-primary\">Parliamone<\/a>\n    <\/nav>\n  <\/div>\n<\/header>\n\n<div class=\"phead\">\n  <div class=\"wrap\">\n    <p class=\"crumb\"><a href=\"index.html\">Home<\/a> &rsaquo; Aree d'impatto &rsaquo; Sostenibilit&agrave; ESG<\/p>\n    <p class=\"eyebrow\">Area d'impatto 02<\/p>\n    <h1>I dati ESG o nascono dai sistemi, o non reggono una verifica<\/h1>\n    <p class=\"lead\">Banche, clienti industriali e stazioni appaltanti hanno smesso di accontentarsi delle dichiarazioni. Colleghiamo le fonti che gi&agrave; avete &mdash; macchine, gestionale, personale &mdash; per produrre indicatori ricostruibili, in giornata.<\/p>\n  <\/div>\n<\/div>\n\n<section>\n  <div class=\"wrap two\">\n    <div class=\"prose\">\n      <p class=\"lead\">La sostenibilit&agrave; ha smesso di essere un capitolo della comunicazione ed &egrave;\n        diventata un requisito contrattuale. Le banche la pesano nel rating, i clienti industriali la\n        chiedono ai fornitori come condizione di fornitura, le gare la mettono tra i criteri di\n        aggiudicazione.<\/p>\n      <p>Il che sposta il problema: non serve un documento ben scritto, serve un dato che regga\n        una verifica. E un dato regge una verifica solo se si pu&ograve; risalire a dove &egrave; nato,\n        chi l'ha prodotto e con quale misura.<\/p>\n      <h2>La domanda scende lungo la filiera<\/h2>\n      <p>Le imprese soggette a rendicontazione di sostenibilit&agrave; devono dichiarare anche gli impatti\n        della propria catena di fornitura. Non potendoli inventare, li chiedono ai fornitori.\n        Per una PMI manifatturiera questo significa ricevere questionari sempre pi&ugrave; puntuali &mdash;\n        consumi per unit&agrave; prodotta, origine dei materiali, infortuni, formazione &mdash; con tempi di\n        risposta stretti.<\/p>\n      <p>Chi risponde con un foglio di calcolo compilato a mano ci mette settimane e resta esposto:\n        i numeri non sono ricostruibili. Chi li estrae dai sistemi risponde in giornata e pu&ograve;\n        dimostrarli.<\/p>\n      <h2>I dati ESG esistono gi&agrave;, sparsi<\/h2>\n      <p>L'energia &egrave; nei contatori e nei dati macchina raccolti dal MES. I trasporti sono nei documenti\n        di consegna. Gli acquisti e la provenienza dei materiali sono nel gestionale. Infortuni, formazione\n        e turni sono nella gestione del personale. Il lavoro non &egrave; inventare una nuova raccolta:\n        &egrave; collegare quelle che gi&agrave; ci sono e dar loro un'unit&agrave; di misura comune.<\/p>\n    <\/div>\n    <div>\n      <div class=\"note\">\n        <p><b>Il punto di partenza pratico.<\/b> Prima si guarda il questionario che il vostro cliente\n          pi&ugrave; esigente vi ha gi&agrave; mandato, o il set di indicatori richiesto dalla vostra banca.\n          Da l&igrave; si torna indietro fino al sistema che pu&ograve; produrre ogni numero. &Egrave; molto pi&ugrave;\n          rapido che partire da un modello teorico di rendicontazione.<\/p>\n      <\/div>\n      <div class=\"facts\" style=\"margin-top:26px\">\n        <div class=\"fact\"><b>Ambientale<\/b><span>energia per unit&agrave; prodotta, rifiuti e scarti,\n          consumi di reparto, logistica<\/span><\/div>\n        <div class=\"fact\"><b>Sociale<\/b><span>sicurezza sul lavoro, formazione erogata,\n          composizione e continuit&agrave; dell'organico<\/span><\/div>\n        <div class=\"fact\"><b>Governance<\/b><span>tracciabilit&agrave; delle approvazioni, gestione dei\n          fornitori, conservazione a norma dei documenti<\/span><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"alt\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <p class=\"eyebrow\">Che cosa facciamo<\/p>\n      <h2>Dalla richiesta del cliente al dato che la soddisfa<\/h2>\n    <\/div>\n    <div class=\"steps\">\n      <div class=\"step\">\n        <b>Fase 01<\/b><h3>Mappa degli indicatori<\/h3>\n        <p>Quali numeri vi vengono effettivamente chiesti, da chi e con quale frequenza. Nessun\n          indicatore entra se nessuno lo domanda.<\/p>\n      <\/div>\n      <div class=\"step\">\n        <b>Fase 02<\/b><h3>Origine del dato<\/h3>\n        <p>Per ciascun indicatore: da quale sistema nasce, chi lo inserisce, dove si perde.\n          Qui emergono i buchi da chiudere.<\/p>\n      <\/div>\n      <div class=\"step\">\n        <b>Fase 03<\/b><h3>Raccolta automatica<\/h3>\n        <p>Contatori, macchine, documenti e gestione del personale collegati, cos&igrave; che il dato\n          si aggiorni da solo e non dipenda da chi si ricorda di compilarlo.<\/p>\n      <\/div>\n      <div class=\"step\">\n        <b>Fase 04<\/b><h3>Cruscotto e risposta<\/h3>\n        <p>Un pannello per la direzione e l'esportazione nei formati richiesti da clienti,\n          banche e stazioni appaltanti.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <p class=\"eyebrow\">Il ritorno<\/p>\n      <h2>Perch&eacute; conviene prima ancora dell'obbligo<\/h2>\n    <\/div>\n    <ul class=\"check\" style=\"max-width:74ch\">\n      <li><b>Fornitura difesa<\/b> &mdash; restare nell'albo fornitori di chi sta gi&agrave; chiedendo dati ESG.<\/li>\n      <li><b>Accesso al credito<\/b> &mdash; un rating di sostenibilit&agrave; documentato incide sulle condizioni.<\/li>\n      <li><b>Consumi che calano<\/b> &mdash; misurare l'energia per reparto e per lotto fa emergere sprechi\n        che nessuno aveva quantificato.<\/li>\n      <li><b>Tempo liberato<\/b> &mdash; i questionari si compilano in ore invece che in settimane.<\/li>\n      <li><b>Gare<\/b> &mdash; criteri ambientali soddisfatti con evidenze, non con dichiarazioni.<\/li>\n    <\/ul>\n  <\/div>\n<\/section>\n<section class=\"alt\"><div class=\"wrap\"><div class=\"sec-head\"><p class=\"eyebrow\">Domande ricorrenti<\/p><h2>Quello che ci chiedono prima di iniziare<\/h2><\/div><div class=\"faq\">\n<details><summary>Siamo una PMI: la rendicontazione non riguarda le grandi imprese?<\/summary><p>L'obbligo diretto s&igrave;, ma l'effetto arriva comunque per via contrattuale. Sono i vostri clienti soggetti all'obbligo a chiedervi i dati, perch&eacute; devono dichiarare anche gli impatti della filiera. In pratica il requisito vi raggiunge come richiesta commerciale, spesso prima che come norma.<\/p><\/details>\n<details><summary>Serve un software specifico per l'ESG?<\/summary><p>Non &egrave; il primo pezzo. La maggior parte del valore sta nel collegare i sistemi che avete gi&agrave; e nel dare un'unit&agrave; di misura comune ai dati. Uno strumento dedicato ha senso dopo, quando la raccolta &egrave; automatica e il volume di richieste lo giustifica.<\/p><\/details>\n<details><summary>Quanto tempo per essere in grado di rispondere a un questionario?<\/summary><p>Dipende da quanti indicatori sono gi&agrave; coperti dai sistemi in uso. La mappa iniziale lo dice con precisione in poche settimane, e di solito il primo blocco di indicatori &mdash; energia e acquisti &mdash; si automatizza prima degli altri.<\/p><\/details>\n<details><summary>Chi certifica i numeri?<\/summary><p>Noi rendiamo il dato tracciabile e ricostruibile: da dove nasce, chi l'ha prodotto, con quale misura. L'eventuale asseverazione o certificazione resta in capo all'ente o al professionista che la rilascia, e lavora molto meglio su dati che hanno una fonte verificabile.<\/p><\/details>\n<\/div><\/div><\/section>\n<div class=\"cta\">\n  <div class=\"wrap\">\n    <h2>Quali dati vi stanno gi&agrave; chiedendo?<\/h2>\n    <p>Portate l'ultimo questionario ricevuto da un cliente o dalla banca. In un incontro vi diciamo quali indicatori i vostri sistemi possono gi&agrave; produrre e quali no.<\/p>\n    <div class=\"row\">\n      <a href=\"modulo.html\" class=\"btn btn-primary\">Richiedi il confronto<\/a>\n      <a class=\"tel\" href=\"tel:+390362163629\">+39 0362 1636293<\/a>\n      <a class=\"tel\" href=\"mailto:commerciale@tp-italia.com\">commerciale@tp-italia.com<\/a>\n    <\/div>\n  <\/div>\n<\/div>\n\n<footer>\n  <div class=\"wrap\">\n    <div class=\"cols\">\n      <div>\n        <h4>Technology Partners Italia<\/h4>\n        <p>Via Vincenzo Monti, 74<br>20832 Desio (MB)<br>Tel +39 0362 1636293<br>\n          <a href=\"mailto:commerciale@tp-italia.com\">commerciale@tp-italia.com<\/a><\/p>\n      <\/div>\n      <div>\n        <h4>Aree d'impatto<\/h4>\n        <a href=\"ai.html\">AI nativa<\/a>\n        <a href=\"esg.html\">Sostenibilit&agrave; ESG<\/a>\n        <a href=\"finanza-agevolata.html\">Finanza agevolata 5.0<\/a>\n      <\/div>\n      <div>\n        <h4>Soluzioni<\/h4>\n        <a href=\"gestionalix.html\">Sistema gestionale ERP<\/a>\n        <a href=\"crm.html\">CRM e portali<\/a>\n        <a href=\"easytime.html\">Fabbrica connessa<\/a>\n        <a href=\"wapp.html\">Logistica di magazzino<\/a>\n        <a href=\"sistemi.html\">Continuit&agrave; e sicurezza<\/a>\n      <\/div>\n      <div>\n        <h4>Azienda<\/h4>\n        <a href=\"azienda.html\">Chi siamo<\/a>\n        <a href=\"newsnew.html\">News<\/a>\n        <a href=\"lavoraconnoi.html\">Lavora con noi<\/a>\n        <a hre isplay:grid;grid-template-columns:repeat(3,1fr);gap:18px}\n.pillar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px 22px 20px;\n  box-shadow:0 14px 38px -22px rgba(8,25,47,.55);display:flex;flex-direction:column;gap:10px;\n  text-decoration:none;color:inherit;border-top:4px solid var(--navy-500);transition:transform .16s,box-shadow .16s}\n.pillar:hover{transform:translateY(-3px);box-shadow:0 20px 44px -20px rgba(8,25,47,.6)}\n.pillar:nth-child(2){border-top-color:var(--ok)}\n.pillar:nth-child(3){border-top-color:var(--bronze)}\n.pillar h3{font-size:1.28rem}\n.pillar p{font-size:.99rem;color:var(--body)}\n.pillar .more{margin-top:auto;font-family:Archivo,sans-serif;font-weight:600;font-size:.92rem;color:var(--navy-500)}\n.pillar-num{font-family:Archivo,sans-serif;font-size:.72rem;font-weight:600;letter-spacing:.14em;\n  text-transform:uppercase;color:var(--muted)}\n\n/* ---------- fascia credenziali ---------- */\n.creds{background:var(--paper-alt);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:30px 0}\n.creds-head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:20px}\n.creds-head p{font-size:.97rem;color:var(--muted)}\n.logos{display:flex;flex-wrap:wrap;align-items:center;gap:34px;justify-content:center}\n.logos img{height:30px;width:auto;opacity:.62;filter:grayscale(1);transition:opacity .15s,filter .15s}\n.logos img:hover{opacity:1;filter:none}\n.logos img.tall{height:44px}\n\n/* ---------- sezioni ---------- */\nsection{padding:74px 0}\nsection.alt{background:var(--paper-alt);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}\n.sec-head{max-width:62ch;margin-bottom:40px;display:flex;flex-direction:column;gap:14px}\n.two{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:start}\n.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:22px}\n.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px 24px;\n  display:flex;flex-direction:column;gap:11px}\n.card h3{color:var(--navy-700)}\n.card p{font-size:1rem}\n.card a{font-family:Archivo,sans-serif;font-weight:600;font-size:.93rem;text-decoration:none;margin-top:auto}\n.card a:hover{text-decoration:underline}\n\n/* numeri / prove */\n.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:2px;\n  background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}\n.fact{background:#fff;padding:26px 24px;display:flex;flex-direction:column;gap:7px}\n.fact b{font-family:Archivo,sans-serif;font-size:2.05rem;font-weight:700;color:var(--navy-700);\n  line-height:1;font-variant-numeric:tabular-nums}\n.fact span{font-size:.95rem;color:var(--muted)}\n\n/* metodo */\n.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:2px solid var(--line)}\n.step{padding:26px 22px 0;border-right:1px solid var(--line);position:relative}\n.step:last-child{border-right:0}\n.step::before{content:\"\";position:absolute;top:-2px;left:0;width:38px;height:2px;background:var(--bronze)}\n.step b{display:block;font-family:Archivo,sans-serif;font-size:.74rem;letter-spacing:.14em;\n  text-transform:uppercase;color:var(--bronze);margin-bottom:9px}\n.step h3{margin-bottom:8px}\n.step p{font-size:.97rem}\n\n/* citazione */\n.quote{border-left:3px solid var(--bronze);padding:6px 0 6px 26px;margin:0}\n.quote p{font-family:Archivo,sans-serif;font-size:1.35rem;line-height:1.4;color:var(--ink);font-weight:600}\n.quote cite{display:block;margin-top:12px;font-style:normal;font-size:.93rem;color:var(--muted)}\n\n/* elenco con segno di spunta */\n.check{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:13px}\n.check li{padding-left:30px;position:relative;font-size:1.02rem}\n.check li::before{content:\"\";position:absolute;left:0;top:.55em;width:14px;height:8px;\n  border-left:2.5px solid var(--ok);border-bottom:2.5px solid var(--ok);transform:rotate(-45deg)}\n\n/* soluzioni */\n.sol{display:grid;grid-template-columns:repeat(auto-fit,minmax(246px,1fr));gap:1px;background:var(--line);\n  border:1px solid var(--line);border-radius:12px;overflow:hidden}\n.sol a{background:#fff;padding:24px 22px;text-decoration:none;color:inherit;display:flex;\n  flex-direction:column;gap:8px;transition:background .14s}\n.sol a:hover{background:var(--paper-alt)}\n.sol b{font-family:Archivo,sans-serif;font-size:1.04rem;color:var(--navy-700)}\n.sol span{font-size:.95rem;color:var(--body)}\n.sol em{font-style:normal;font-size:.83rem;color:var(--muted);margin-top:2px}\n\n/* richiamo finale */\n.cta{background:var(--navy-900);color:#fff;padding:66px 0}\n.cta h2{color:#fff;max-width:20ch}\n.cta p{color:#c3d6ee;max-width:56ch;margin-top:14px;font-size:1.1rem}\n.cta .row{display:flex;gap:30px;align-items:center;flex-wrap:wrap;margin-top:26px}\n.cta a.tel{color:#fff;font-family:Archivo,sans-serif;font-weight:600;text-decoration:none;font-size:1.05rem}\n\n/* piede */\nfooter{background:#061426;color:#9db4d1;padding:52px 0 34px;font-size:.95rem}\nfooter .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:36px}\nfooter h4{color:#fff;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}\nfooter a{color:#9db4d1;text-decoration:none;display:block;padding:3px 0}\nfooter a:hover{color:#fff}\nfooter .legal{margin-top:38px;padding-top:20px;border-top:1px solid rgba(255,255,255,.13);\n  display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:.87rem;color:#728ba9}\n\n/* ---------- pagine interne ---------- */\n.phead{background:linear-gradient(160deg,var(--navy-900),var(--navy-700));color:#fff;padding:52px 0 48px}\n.phead h1{color:#fff;max-width:17ch}\n.phead .lead{color:#cfe0f5;max-width:62ch;margin-top:18px}\n.phead .eyebrow{color:#8fc0f2}\n.crumb{font-size:.9rem;color:#8fb2dd;margin-bottom:18px}\n.crumb a{color:#8fb2dd;text-decoration:none}\n.crumb a:hover{color:#fff}\n.prose{max-width:70ch;display:flex;flex-direction:column;gap:20px}\n.prose h2{margin-top:22px}\n.prose h3{margin-top:12px}\n.note{background:var(--bronze-soft);border-left:3px solid var(--bronze);padding:18px 22px;border-radius:0 8px 8px 0;\n  font-size:.99rem}\n.note b{color:var(--ink)}\n.faq{border-top:1px solid var(--line)}\n.faq details{border-bottom:1px solid var(--line);padding:18px 0}\n.faq summary{font-family:Archivo,sans-serif;font-weight:600;font-size:1.05rem;color:var(--ink);cursor:pointer;\n  list-style:none;display:flex;justify-content:space-between;gap:18px}\n.faq summary::after{content:\"+\";color:var(--bronze);font-size:1.4rem;line-height:1}\n.faq details[open] summary::after{content:\"\u2013\"}\n.faq p{margin-top:12px;max-width:70ch}\n\n/* ---------- adattamento agli schermi piccoli ---------- */\n@media (max-width:900px){\n  .two{grid-template-columns:1fr;gap:34px}\n  .pillars .grid{grid-template-columns:1fr}\n  .pillars{margin-top:-18px}\n  .steps{grid-template-columns:1fr 1fr}\n  .step{border-bottom:1px solid var(--line);padding-bottom:22px}\n  footer .cols{grid-template-columns:1fr 1fr}\n}\n@media (max-width:720px){\n  body{font-size:16px}\n  .nav{display:none;position:absolute;top:76px;left:0;right:0;background:#fff;flex-direction:column;\n    align-items:stretch;gap:0;padding:8px 24px 18px;border-bottom:1px solid var(--line);\n    box-shadow:0 18px 30px -20px rgba(8,25,47,.5)}\n  .nav.open{display:flex}\n  .nav a{padding:12px 0;border-bottom:1px solid var(--line)}\n  .nav .btn{margin-top:12px;justify-content:center}\n  .burger{display:block}\n  .top .wrap{position:relative}\n  section{padding:52px 0}\n  .hero .wrap{padding-top:40px}\n  .steps{grid-template-columns:1fr}\n  footer .cols{grid-template-columns:1fr}\n}\n\n<\/style>\n<\/head>\n<body>\n\n<header class=\"top\">\n  <div class=\"wrap\">\n    <a class=\"brandlock\" href=\"index.html\" aria-label=\"Technology Partners Italia, home\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAKAAAACgCAYAAACLz2ctAABY4UlEQVR42u29eZwdVZk l motivo per cui una pratica agevolativa si vince o si perde molto prima della domanda:\n        si decide quando si sceglie come impostare il progetto, quali dati far produrre agli impianti\n        e come conservarli. Un progetto disegnato senza pensarci arriva alla scadenza con le fatture\n        in ordine e le evidenze tecniche mancanti.<\/p>\n      <h2>Il nostro ruolo &egrave; tecnico, non burocratico<\/h2>\n      <p>Non ci sostituiamo al vostro commercialista n&eacute; al professionista che firma le perizie:\n        lavoriamo accanto a loro. Noi rispondiamo della parte che nessuno dei due pu&ograve; coprire &mdash;\n        far s&igrave; che macchine, gestionale e sistema di fabbrica producano davvero, e conservino,\n        le evidenze che la misura richiede.<\/p>\n      <p>In concreto: interconnessione reale al sistema gestionale, tracciamento dell'ordine di produzione,\n        registrazione dei consumi prima e dopo l'intervento, archiviazione a norma di ci&ograve; che dovr&agrave;\n        essere esibito in caso di controllo, anche a distanza di anni.<\/p>\n    <\/div>\n    <div>\n      <div class=\"note\">\n        <p><b>Una precisazione doverosa.<\/b> Le misure agevolative cambiano: aliquote, finestre temporali\n          e requisiti vengono aggiornati di anno in anno e alcune si esauriscono con le risorse stanziate.\n          Per questo non troverete percentuali su questa pagina: verifichiamo caso per caso quali misure\n          sono aperte al momento in cui il vostro progetto parte, e su quelle costruiamo il piano.<\/p>\n      <\/div>\n      <div class=\"facts\" style=\"margin-top:26px\">\n        <div class=\"fact\"><b>Prima<\/b><span>verifica di ammissibilit&agrave; e stima della copertura,\n          prima di firmare qualsiasi ordine<\/span><\/div>\n        <div class=\"fact\"><b>Durante<\/b><span>i sistemi configurati per generare le evidenze\n          richieste, non adattati dopo<\/span><\/div>\n        <div class=\"fact\"><b>Dopo<\/b><span>conservazione delle prove per l'intero periodo\n          in cui possono essere richieste<\/span><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"alt\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <p class=\"eyebrow\">Come procediamo<\/p>\n      <h2>Dalla verifica al credito riconosciuto<\/h2>\n    <\/div>\n    <div class=\"cards\">\n      <article class=\"card\">\n        <h3>Verifica di ammissibilit&agrave;<\/h3>\n        <p>Che cosa avete in programma di fare, quali misure lo intercettano, quali requisiti tecnici\n          comporta ciascuna. Il risultato &egrave; un s&igrave; o un no motivato, non una promessa.<\/p>\n      <\/article>\n      <article class=\"card\">\n        <h3>Progetto che regge i requisiti<\/h3>\n        <p>L'impianto tecnico viene disegnato perch&eacute; i requisiti siano soddisfatti per costruzione:\n          interconnessione, tracciabilit&agrave; e misure energetiche nascono dal progetto, non da una\n          rincorsa finale.<\/p>\n      <\/article>\n      <article class=\"card\">\n        <h3>Evidenze e fascicolo<\/h3>\n        <p>Raccogliamo e ordiniamo la documentazione tecnica che la pratica richiede, nella forma\n          in cui va presentata, e la mettiamo a disposizione di chi firma perizie e dichiarazioni.<\/p>\n      <\/article>\n      <article class=\"card\">\n        <h3>Tenuta nel tempo<\/h3>\n        <p>Le verifiche possono arrivare anni dopo. Le prove restano conservate a norma e recuperabili,\n          insieme allo storico dei dati che le sostengono.<\/p>\n      <\/article>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <p class=\"eyebrow\">Su che cosa si applica<\/p>\n      <h2>Gli interventi che pi&ugrave; spesso rientrano<\/h2>\n      <p class=\"lead\">Sono anche quelli su cui lavoriamo tutti i giorni: &egrave; la sovrapposizione\n        che rende sensato occuparcene noi.<\/p>\n    <\/div>\n    <ul class=\"check\" style=\"max-width:74ch\">\n      <li><b>Interconnessione di macchine e impianti<\/b> al sistema gestionale, con raccolta dei dati\n        di produzione in tempo reale.<\/li>\n      <li><b>Sistemi di fabbrica<\/b> per tempi, fermi, scarti e qualit&agrave;, e loro integrazione con\n        la pianificazione.<\/li>\n      <li><b>Logistica di magazzino<\/b> con identificazione automatica e tracciabilit&agrave; dei lotti.<\/li>\n      <li><b>Misura dei consumi energetici<\/b> per reparto, macchina o lotto, con confronto prima/dopo.<\/li>\n      <li><b>Formazione del personale<\/b> sulle nuove competenze digitali, quando la misura la prevede.<\/li>\n    <\/ul>\n  <\/div>\n<\/section>\n<section class=\"alt\"><div class=\"wrap\"><div class=\"sec-head\"><p class=\"eyebrow\">Domande ricorrenti<\/p><h2>Quello che ci chiedono prima di iniziare<\/h2><\/div><div class=\"faq\">\n<details><summary>Vi occupate voi della pratica?<\/summary><p>Ci occupiamo della parte tecnica: ammissibilit&agrave;, progettazione dei requisiti, evidenze e documentazione tecnica. La presentazione e gli adempimenti fiscali restano al vostro commercialista o al consulente specializzato, con cui lavoriamo in modo coordinato. Se non ne avete uno, vi indichiamo con chi abbiamo gi&agrave; collaborato.<\/p><\/details>\n<details><summary>E se l'agevolazione non viene riconosciuta?<\/summary><p>Per questo la verifica di ammissibilit&agrave; viene prima di tutto il resto e ha come esito possibile un no. Un progetto che regge in s&eacute; deve restare conveniente anche senza incentivo: l'agevolazione migliora il ritorno, non deve essere ci&ograve; che lo giustifica.<\/p><\/details>\n<details><summary>Possiamo partire adesso o conviene aspettare la prossima misura?<\/summary><p>Dipende dalle finestre aperte e dalle risorse ancora disponibili, che verifichiamo al momento. Aspettare ha un costo: i mesi di inefficienza che continuate a pagare mentre attendete. Nel confronto iniziale mettiamo a confronto le due ipotesi con i numeri.<\/p><\/details>\n<details><summary>Quali dati dovremo conservare, e per quanto?<\/summary><p>Dipende dalla misura, ma il principio &egrave; costante: deve essere possibile ricostruire a distanza di anni che cosa &egrave; stato installato, come era interconnesso e quali risultati ha prodotto. Configuriamo la conservazione perch&eacute; questo sia possibile senza dipendere dalla memoria delle persone.<\/p><\/details>\n<\/div><\/div><\/section>\n<div class=\"cta\">\n  <div class=\"wrap\">\n    <h2>Vale la pena verificare prima di firmare.<\/h2>\n    <p>Se avete un investimento in programma, la verifica di ammissibilit&agrave; si fa adesso: cambia il modo in cui il progetto va disegnato, e a volte cambia anche la sua convenienza.<\/p>\n    <div class=\"row\">\n      <a href=\"modulo.html\" class=\"btn btn-primary\">Richiedi il confronto<\/a>\n      <a class=\"tel\" href=\"tel:+390362163629\">+39 0362 1636293<\/a>\n      <a class=\"tel\" href=\"mailto:commerciale@tp-italia.com\">commerciale@tp-italia.com<\/a>\n    <\/div>\n  <\/div>\n<\/div>\n\n<footer>\n  <div class=\"wrap\">\n    <div class=\"cols\">\n      <div>\n        <h4>Technology Partners Italia<\/h4>\n        <p>Via Vincenzo Monti, 74<br>20832 Desio (MB)<br>Tel +39 0362 1636293<br>\n          <a href=\"mailto:commerciale@tp-italia.com\">commerciale@tp-italia.com<\/a><\/p>\n      <\/div>\n      <div>\n        <h4>Aree d'impatto<\/h4>\n        <a href=\"ai.html\">AI nativa<\/a>\n        <a href=\"esg.html\">Sostenibilit&agrave; ESG<\/a>\n        <a href=\"finanza-agevolata.html\">Finanza agevolata 5.0<\/a>\n      <\/div>\n      <div>\n        <h4>Soluzioni<\/h4>\n        <a href=\"gestionalix.html\">Sistema gestionale ERP<\/a>\n        <a href=\"crm.html\">CRM e portali<\/a>\n        <a href=\"easytime.html\">Fabbrica connessa<\/a>\n        <a href=\"wapp.html\">Logistica di magazzino<\/a>\n        <a href=\"sistemi.html\">Continuit&agrave; e sicurezza<\/a>\n      <\/div>\n      <div>\n   b.onclick=function(){go(x[0]);}; tabs.appendChild(b);
